name: Render uptime check

on:
  schedule:
    # Offset from the busy start of each hour. Scheduling is best-effort.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-uptime.yml'
      - 'scripts/check-health.mjs'

permissions:
  contents: read

concurrency:
  group: render-uptime
  cancel-in-progress: false

jobs:
  check:
    name: Check VibeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate monitor
        run: node --test tests/health-monitor.test.mjs
      - name: Check the live application
        env:
          HEALTHCHECK_URL: https://vibecheck-gh7u.onrender.com/api/health
        run: node scripts/check-health.mjs

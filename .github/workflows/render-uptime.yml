name: Render uptime check

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-uptime
  cancel-in-progress: true

jobs:
  check:
    name: Check VibeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --max-time 110 \
            --retry 2 \
            --retry-delay 5 \
            https://vibecheck-gh7u.onrender.com/api/health
